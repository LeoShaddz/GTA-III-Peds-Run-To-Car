; PedsRunToCarIII (GTA III 1.0 PC) - NOT COMPILED, NOT TESTED
; Peds walking to a car to get in (e.g. mission peds that must enter your car) run instead of walking.
[Settings]
; 1 = they sprint instead of run. 0 = run (default).
Sprint=0

; 1 = writes PedsRunToCarIII.log in the game folder (shows each move-state request made while a ped seeks a car)
EnableLog=0
